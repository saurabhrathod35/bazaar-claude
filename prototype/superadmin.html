<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeenPlaza Super Admin — Platform Ops Portal</title>
<meta name="description" content="KeenPlaza Super Admin Portal prototype — cross-tenant list, onboarding, feature flags and incident troubleshooting for the backend on-call team.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231a1030'/><text y='72' x='50' font-size='58' font-family='Arial' font-weight='bold' fill='%23f6c945' text-anchor='middle'>S</text></svg>">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dev.css">
<link rel="stylesheet" href="css/admin.css">
<script src="js/theme.js"></script>
<style>
  .sb-head .mark{background:#f6c945; color:#1a1030}
  .sa-badge{display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:800; letter-spacing:.08em;
    text-transform:uppercase; color:#1a1030; background:#f6c945; padding:3px 8px; border-radius:99px}
  .health-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px}
  .health-healthy{background:var(--success)} .health-degraded{background:var(--warning)}
  .health-critical{background:var(--error)} .health-pending{background:var(--n-400)}
  .tl-row{display:grid; grid-template-columns:150px 1fr 90px; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); font-size:var(--fs-sm)}
  .tl-row:last-child{border-bottom:none}
</style>
</head>
<body class="admin">
  <div class="shell">
    <aside class="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn mobile-topbar" id="burger" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="col grow">
          <span class="crumb" id="saCrumb">KeenPlaza Super Admin</span>
          <h1 id="saTitle">Tenants</h1>
        </div>
        <span class="sa-badge">🔒 Platform Admin session · MFA verified</span>
        <span class="avatar avatar-sm hide-sm" style="background:#f6c945;color:#1a1030">PS</span>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/superadmin.js"></script>
</body>
</html>
