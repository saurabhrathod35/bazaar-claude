<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeenPlaza Mobile App — Prototype</title>
<meta name="description" content="KeenPlaza mobile app prototype — 22 interactive screens in a 390×844 device frame.">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dev.css">
<link rel="stylesheet" href="css/storefront.css">
<link rel="stylesheet" href="css/mobile.css">
<script src="js/theme.js"></script>
</head>
<body class="mobile">
  <div class="mob-shell">
    <aside class="picker">
      <span class="eyebrow">KeenPlaza Prototype</span>
      <h1 class="mt-2">Mobile App</h1>
      <p class="small muted mt-2">22 screens · 390 × 844. Tap a screen, or use ← → keys.</p>
      <div class="row gap-2 mt-4">
        <a class="btn btn-outline btn-sm" href="index.html">Website</a>
        <a class="btn btn-outline btn-sm" href="admin.html">Admin</a>
      </div>
      <div class="list mt-2" id="pickerList"></div>
    </aside>

    <div class="stage">
      <div class="device"><div class="screen" id="screen"></div></div>
      <div class="frame-caption">
        <b id="capTitle">Splash</b>
        <p id="capText"></p>
        <div class="frame-nav mt-3" style="justify-content:center">
          <button class="btn btn-outline btn-sm" id="prevS">← Previous</button>
          <button class="btn btn-primary btn-sm" id="nextS">Next screen →</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/dev-data.js"></script>
  <script src="js/dev-mode.js"></script>
</body>
</html>
